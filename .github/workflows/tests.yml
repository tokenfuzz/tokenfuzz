name: tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-host:
    name: tests (ubuntu, py${{ matrix.python-version }})
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Test the documented floor and newest stable Python. The container and
        # macOS jobs cover the system Python versions between them.
        python-version: ["3.10", "3.14"]
    env:
      LLM_DECIDE_DISABLE: "1"
      TEST_JOBS_MAX: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime dependencies
        # Pass the matrix value through the environment so it is never expanded
        # into the shell source.
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          sudo bash tests/run-tests.sh --install-container-deps
          if [ "$PYTHON_VERSION" = "3.10" ]; then
            python3 -m pip install tomli
          fi

      - name: Show tool versions
        run: |
          bash --version | head -1
          python3 --version
          jq --version
          clang --version | head -1
          rg --version | head -1

      - name: Run test suite
        run: bash tests/run-tests.sh

  macos-host:
    name: tests (macos)
    permissions:
      contents: read
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      LLM_DECIDE_DISABLE: "1"
      TEST_JOBS_MAX: "4"
      LLVM_PREFIX: /opt/homebrew/opt/llvm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          brew install jq ripgrep llvm mercurial

      - name: Show tool versions
        run: |
          /bin/bash --version | head -1
          python3 --version
          jq --version
          clang --version | head -1
          rg --version | head -1

      - name: Run test suite
        run: /bin/bash tests/run-tests.sh

  ubuntu-container:
    name: tests (ubuntu container)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LLM_DECIDE_DISABLE: "1"
      TEST_JOBS_MAX: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Show Docker version
        run: docker version

      - name: Run test suite in Ubuntu image
        run: bash tests/run-tests.sh --image ubuntu:24.04 --jobs 4

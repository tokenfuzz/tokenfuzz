<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
     role="img" aria-label="TokenFuzz audit lifecycle: set up and preflight the target, agents either file source-only findings or run one testcase through probe, lane-specific validation records findings, crashes, rejected or unsettled artifacts, and crash bundles">
  <title>TokenFuzz audit lifecycle</title>
  <defs>
    <marker id="al-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <filter id="al-shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style><![CDATA[
      .step       { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 10; ry: 10; }
      .step-num   { font-size: 11px; fill: #ffffff; font-weight: 700; text-anchor: middle; }
      .step-dot   { fill: #4f46e5; }
      .agent      { fill: #ecfeff; stroke: #06b6d4; stroke-width: 1.4; rx: 10; ry: 10; }
      .gate       { fill: #fef3c7; stroke: #b45309; stroke-width: 1.5; }
      .crash      { fill: #fee2e2; stroke: #ef4444; stroke-width: 1.3; rx: 10; ry: 10; }
      .find       { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.3; rx: 10; ry: 10; }
      .reject     { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.2; stroke-dasharray: 5 3; rx: 10; ry: 10; }
      .bundle     { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.3; rx: 10; ry: 10; }
      .arrow      { stroke: #475569; stroke-width: 1.5; fill: none; }
      .title      { font-size: 14px; font-weight: 600; fill: #0f172a; }
      .sub        { font-size: 12px; fill: #475569; }
      .micro      { font-size: 11px; fill: #475569; }
      .chip       { font-size: 10.5px; fill: #475569; font-weight: 600; }
      .gate-label { font-size: 13px; font-weight: 700; fill: #7c2d12; text-anchor: middle; }
      .gate-sub   { font-size: 11px; fill: #92400e; text-anchor: middle; }
      .out-tag    { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    ]]></style>
  </defs>

  <!-- Step 1: Set up the target -->
  <circle cx="40" cy="58" r="13" class="step-dot"/>
  <text x="40" y="62" class="step-num">1</text>
  <g filter="url(#al-shadow)"><rect x="70" y="28" width="850" height="60" class="step"/></g>
  <text x="90"  y="52"  class="title">Set up the target</text>
  <text x="90"  y="74"  class="sub">Add the source checkout and review the generated runner, sanitizer, and threat-model config.</text>

  <path d="M480,88 L480,112" class="arrow" marker-end="url(#al-arrow)"/>

  <!-- Step 2: Run the audit -->
  <circle cx="40" cy="142" r="13" class="step-dot"/>
  <text x="40" y="146" class="step-num">2</text>
  <g filter="url(#al-shadow)"><rect x="70" y="112" width="850" height="64" class="step"/></g>
  <text x="90"  y="136" class="title">Run the audit</text>
  <text x="90"  y="158" class="sub">Preflight converges the build, pins revision and config, creates results, then launches the selected backend.</text>
  <text x="90"  y="172" class="micro">Claims, runs, notes, and events append; cards and current hypotheses update atomically.</text>

  <path d="M480,176 L480,206" class="arrow" marker-end="url(#al-arrow)"/>

  <!-- Step 3: Agents investigate -->
  <circle cx="40" cy="256" r="13" class="step-dot"/>
  <text x="40" y="260" class="step-num">3</text>
  <g filter="url(#al-shadow)"><rect x="70" y="206" width="850" height="100" class="agent"/></g>
  <text x="90"  y="230" class="title">Agents investigate, with one active investigation at a time</text>
  <text x="90"  y="252" class="sub">An analysis agent can file a concrete source-only FIND; a reproduce agent writes one testcase and runs bin/probe.</text>
  <text x="90"  y="274" class="sub">Browser/JS misses stop before sanitizer; native misses are feedback. Diagnostics are confirmed before promotion.</text>
  <text x="90"  y="296" class="micro">The scheduler offers the highest eligible card for the assigned strategy.</text>

  <path d="M330,306 C330,326 390,342 416,354" class="arrow" marker-end="url(#al-arrow)"/>
  <text x="242" y="326" class="micro">source-only FIND</text>
  <path d="M630,306 C630,326 570,342 544,354" class="arrow" marker-end="url(#al-arrow)"/>
  <text x="622" y="326" class="micro">testcase → bin/probe</text>

  <!-- Step 4: Triage diamond -->
  <g filter="url(#al-shadow)">
    <polygon points="480,326 640,396 480,466 320,396" class="gate"/>
  </g>
  <text x="480" y="384" class="gate-label">LANE-SPECIFIC VALIDATION</text>
  <text x="480" y="404" class="gate-sub">FIND: source-grounded substance</text>
  <text x="480" y="422" class="gate-sub">CRASH: diagnostic + reproduction</text>

  <!-- Outcomes row -->
  <g filter="url(#al-shadow)"><rect x="40"  y="476" width="240" height="64" class="find"/></g>
  <text x="56"  y="494" class="out-tag" fill="#166534">Finding lane</text>
  <text x="56"  y="512" class="title">findings/FIND-*</text>
  <text x="56"  y="530" class="micro">Report state stays with evidence.</text>

  <g filter="url(#al-shadow)"><rect x="300" y="476" width="240" height="64" class="crash"/></g>
  <text x="316" y="494" class="out-tag" fill="#991b1b">Crash lane</text>
  <text x="316" y="512" class="title">crashes/CRASH-*</text>
  <text x="316" y="530" class="micro">Testcase and diagnostic retained.</text>

  <g filter="url(#al-shadow)"><rect x="560" y="476" width="180" height="64" class="reject"/></g>
  <text x="576" y="494" class="out-tag" fill="#374151">Preserved</text>
  <text x="576" y="512" class="title">rejected / unsettled</text>
  <text x="576" y="530" class="micro">Reason or review retained.</text>

  <g filter="url(#al-shadow)"><rect x="760" y="476" width="160" height="64" class="bundle"/></g>
  <text x="776" y="494" class="out-tag" fill="#9a3412">Auto-export</text>
  <text x="776" y="509" class="title">maintainer bundle</text>
  <text x="776" y="523" class="micro">report, input, diagnostic,</text>
  <text x="776" y="536" class="micro">reproduce.sh</text>

  <!-- Triage arrows to outcomes -->
  <path d="M402,430 C330,462 230,474 165,476" class="arrow" marker-end="url(#al-arrow)"/>
  <path d="M480,466 L420,476" class="arrow" marker-end="url(#al-arrow)"/>
  <path d="M558,430 C600,452 625,468 650,476" class="arrow" marker-end="url(#al-arrow)"/>
  <!-- crash -> bundle -->
  <path d="M540,528 C610,560 700,560 760,528" class="arrow" marker-end="url(#al-arrow)"/>
</svg>
